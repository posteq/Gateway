name: study-microservice

services:
  gateway-service:
    image: ${GATEWAY_IMAGE:-gateway-service:latest}
    ports:
      - "8080:8080"
    environment:
      AUTH_JWKS_URL: http://auth-service:8082/.well-known/jwks.json
      AUTH_SERVICE_URL: http://auth-service:8082
      USER_SERVICE_URL: http://user-service:8081
      ORDER_SERVICE_URL: http://order-service:8083
    networks: [edge,backend]
    depends_on:
    - auth-service
    - user-service
    - order-service

##~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  auth-service:
    image: ${AUTH_SERVICE_IMAGE:-auth-service:latest}
    environment:
      SPRING_ACTIVE_PROFILE: docker
      DB_URL: jdbc:postgresql://auth-db:5432/authdb
      DB_USERNAME: ${AUTH_DB_USER:-postgres}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-demo}
      USER_SERVICE_URL: http://user-service:8081
    depends_on:
      auth-db:
        condition: service_healthy
    networks: [backend]

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: ${AUTH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-demo}
    volumes:
      - auth-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

##~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  user-service:
    image: ${USER_SERVICE_IMAGE:-user-service:latest}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://user-db:5432/userdb
      DB_USERNAME: ${USER_DB_USER:-postgres}
      DB_PASSWORD: ${USER_DB_PASSWORD:-demo}
      REDIS_HOST: user-redis
      AUTH_JWKS_URI: http://auth-service:8082/.well-known/jwks.json
    depends_on:
      user-db:
        condition: service_healthy
      user-redis:
        condition: service_healthy
    networks: [backend]

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: ${USER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-demo}
    volumes:
      - user-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  user-redis:
    image: redis:7.2-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

##~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

  order-service:
    image: ${ORDER_SERVICE_IMAGE:-order-service:latest}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://order-db:5432/orderdb
      DB_USERNAME: ${ORDER_DB_USER:-postgres}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-demo}
      REDIS_HOST: order-redis
      AUTH_JWKS_URI: http://auth-service:8082/.well-known/jwks.json
      USER_SERVICE_URL: http://user-service:8081
    depends_on:
      order-db:
        condition: service_healthy
      order-redis:
        condition: service_healthy
    networks: [backend]

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: ${ORDER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-demo}
    volumes:
      - order-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  order-redis:
    image: redis:7.2-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

##~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
volumes:
  auth-pgdata:
  user-pgdata:
  order-pgdata: