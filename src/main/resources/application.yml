server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVER:http://localhost:8082}/.well-known/jwks.json

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${USER_SERVER:http://localhost:8081}
              predicates:
                - Path= /api/users/** , /api/cards/**
            - id: auth-service
              uri: ${AUTH_SERVER:http://localhost:8082}
              predicates:
                - Path= /api/**